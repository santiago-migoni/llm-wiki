# Configuración compatible con el CLI instalado y roles declarados explícitamente.
# Modelos y permisos del principal se heredan del entorno del colaborador.
[features]
multi_agent = true

[agents]
max_threads = 3

[agents.code_reviewer]
description = "Revisión independiente de corrección, compatibilidad y cobertura de pruebas."
config_file = "agents/code_reviewer.toml"

[agents.implementer]
description = "Implementa una tarea acotada del runtime, workflows o paquete con pruebas de regresión."
config_file = "agents/implementer.toml"

[agents.release_reviewer]
description = "Revisión del paquete distribuible, procedencia, privacidad y evidencia de instalación."
config_file = "agents/release_reviewer.toml"

[agents.security_reviewer]
description = "Revisión de fronteras de confianza, privacidad y disponibilidad del runtime local."
config_file = "agents/security_reviewer.toml"
